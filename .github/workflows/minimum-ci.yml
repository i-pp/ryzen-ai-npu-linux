# Added 2026-11-12: always-run, offline minimum CI; not hardware or release acceptance.

name: Minimum CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minimum:
    name: Minimum source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run offline fixtures without SDK or device access
        run: |
          python3 -B - <<'PYTEST'
          import unittest
          suite = unittest.TestLoader().discover('tests')
          if suite.countTestCases() < 39:
              raise SystemExit('Missing baseline tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.expectedFailures:
              raise SystemExit('Tests failed or were not fully executed')
          PYTEST

  license:
    name: License policy checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify latest stable license checker artifact
        uses: i-pp/license-check-ci@f6f00d79e73562ae7d200abac986b2e9ce72252d

  minimum_ci:
    name: Minimum CI
    needs: [minimum, license]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all minimum checks to succeed
        shell: bash
        env:
          SOURCE_RESULT: ${{ needs.minimum.result }}
          LICENSE_RESULT: ${{ needs.license.result }}
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = success
          test "$LICENSE_RESULT" = success
